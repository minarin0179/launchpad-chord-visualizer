<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launchpad X — Chord Visualizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Launchpad X // Chord Visualizer</h1>
  <p>Select a chord and light up the pads</p>
</header>

<div id="midi-status" class="searching">Searching for MIDI...</div>

<!-- Song: YouTube + chord progression (Songle / analysis) synced to pads & Launchpad -->
<section id="song-bar" class="song-bar">
  <div class="song-head">
    <span class="panel-label song-title">Song</span>
    <input id="song-url" type="url" placeholder="YouTube URL — chords from Songle or ANALYZE">
    <button class="btn" id="song-load">LOAD</button>
    <select id="song-source" disabled title="Chord source"></select>
    <a id="song-analyze-link" class="song-link" href="analyze.html" target="_blank" rel="noopener">ANALYZE ↗</a>
    <button class="btn song-collapse" id="song-collapse" title="Collapse">▾</button>
  </div>
  <div id="song-body" class="song-body" hidden>
    <div class="song-main">
      <div class="song-player-wrap"><div id="song-player"></div></div>
      <div class="song-info">
        <div class="song-now-row">
          <div class="song-now-box">
            <span class="song-k">NOW</span>
            <div id="song-now">—</div>
            <div id="song-now-real"></div>
          </div>
          <div class="song-next-box">
            <span class="song-k">NEXT</span>
            <span id="song-next">—</span>
            <span id="song-next-in"></span>
          </div>
        </div>
        <div class="song-row">
          <span class="song-k">KEY</span> <span id="song-key">—</span>
          <span class="song-k">TEMPO</span> <span id="song-tempo">—</span>
        </div>
        <div class="song-row">
          <span class="song-k">CAPO</span>
          <button class="btn" id="song-capo-down">◄</button>
          <span id="song-capo" class="song-capo">0</span>
          <button class="btn" id="song-capo-up">►</button>
          <button class="btn active" id="song-capo-auto" title="Capo where chord tones fit the C major scale best">AUTO</button>
        </div>
        <div class="song-row">
          <button class="btn" id="song-play" title="Play / Pause (Launchpad CC95)">▶</button>
          <button class="btn" id="song-back" title="Back 1 bar (CC96)">◄◄</button>
          <button class="btn" id="song-follow" disabled title="Light the pads with the song's chords (CC97)">FOLLOW</button>
          <button class="btn" id="song-loop-btn" title="A-B loop: set A → set B → clear (CC98)">A-B</button>
        </div>
        <div id="song-status" class="song-status"></div>
      </div>
    </div>
    <div id="song-timeline" class="song-timeline">
      <div id="song-strip" class="song-strip">
        <div id="song-blocks"></div>
        <div id="song-loop" class="song-loop" hidden></div>
      </div>
      <div class="song-playhead"></div>
    </div>
  </div>
</section>

<div class="app-layout">

  <!-- Left: MIDI / Audio / Debug -->
  <aside class="panel-left">
    <div class="panel-section">
      <div class="panel-label">Device</div>
      <div class="midi-row">
        <select id="device-select"><option value="">-- No MIDI device --</option></select>
        <button class="send-btn" id="rescan-btn">RESCAN</button>
        <button class="send-btn" id="send-btn" disabled>SEND</button>
        <button class="send-btn" id="clear-btn" disabled>CLEAR</button>
      </div>
      <div id="midi-hint" class="hidden">
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">Volume</div>
      <div class="volume-row">
        <input type="range" id="volume" min="0" max="100" value="50">
        <span id="volume-label">50%</span>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">Metronome</div>
      <div class="metro-row">
        <span>BPM</span>
        <input type="range" id="metro-bpm" min="40" max="240" value="120" step="1">
        <input type="number" id="metro-bpm-num" min="40" max="240" value="120">
        <button class="btn" id="metro-btn">▶ START</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">Sound</div>
      <div class="btn-row" id="instrument-buttons"></div>
      <div id="sound-status" class="sound-status hidden"></div>
    </div>

    <div class="panel-section panel-section--log">
      <div class="panel-label">Log</div>
      <div id="log"></div>
    </div>
  </aside>

  <!-- Center: Launchpad -->
  <main class="panel-center">
    <div class="grid-wrapper">
      <div id="scale-key-label"></div>
      <div class="grid" id="pad-grid"></div>
    </div>

    <div id="chord-display">
      <div id="chord-name">&mdash;</div>
      <div id="chord-notes"></div>
      <div id="chord-interval"></div>
    </div>

    <div id="detected-chord">
      <span class="detected-label">DETECTED</span>
      <span id="detected-chord-names"><span class="detected-chord-empty">—</span></span>
    </div>
  </main>

  <!-- Right: Chord Controls -->
  <aside class="panel-right">
    <div class="controls">
      <div class="control-group">
        <label class="root-label">Root</label>
        <div class="btn-row" id="root-buttons"></div>
      </div>
      <div class="control-group">
        <button class="toggle-btn t-chord active" id="toggle-chord">
          <span class="dot"></span>Chord
        </button>
        <div id="chord-control">
          <div class="btn-row" id="chord-buttons"></div>
        </div>
      </div>
      <div class="control-group">
        <button class="toggle-btn t-scale active" id="toggle-scale">
          <span class="dot"></span>Scale
        </button>
        <div id="scale-control">
          <div class="btn-row" id="scale-buttons"></div>
        </div>
      </div>
      <div class="control-group">
        <button class="toggle-btn t-inversion" id="toggle-inversion">
          <span class="dot"></span>Inversion
        </button>
        <div id="inversion-control" class="hidden">
          <div id="inversion-row"></div>
        </div>
      </div>
      <div class="control-group">
        <label>Capo</label>
        <div class="btn-row">
          <button class="btn" id="capo-down">◄</button>
          <span id="capo-display">0</span>
          <button class="btn" id="capo-up">►</button>
          <button class="btn" id="capo-reset">RST</button>
        </div>
      </div>
    </div>

  </aside>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
